"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf).
"""
scalar JSON

scalar BigInt

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type ViewPageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

type Meta {
  status: JSON
}

type Query {
  onchainEvent(id: String!): onchainEvent
  onchainEvents(where: onchainEventFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): onchainEventPage!
  _meta: Meta
}

type onchainEvent {
  id: String!
  chainId: Int!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  txHash: String!
  logIndex: Int!
  contract: String!
  event: String!
  args: JSON!
}

type onchainEventPage {
  items: [onchainEvent!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

input onchainEventFilter {
  AND: [onchainEventFilter]
  OR: [onchainEventFilter]
  id: String
  id_not: String
  id_in: [String]
  id_not_in: [String]
  id_contains: String
  id_not_contains: String
