  logIndex_in: [Int]
  logIndex_not_in: [Int]
  logIndex_gt: Int
  logIndex_lt: Int
  logIndex_gte: Int
  logIndex_lte: Int
  contract: String
  contract_not: String
  contract_in: [String]
  contract_not_in: [String]
  contract_contains: String
  contract_not_contains: String
  contract_starts_with: String
  contract_ends_with: String
