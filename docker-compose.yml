services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nundina
      POSTGRES_PASSWORD: nundina
      POSTGRES_DB: nundina
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nundina"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
